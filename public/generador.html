<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Licencias - LIS Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow p-4">
            <h3 class="text-center text-primary mb-1">LIS Lab Keygen</h3>
            <p class="text-muted text-center small mb-4">Generador Privado de Licencias para Laboratorios</p>
            
            <form id="formGen">
                <div class="mb-3">
                    <label class="form-label">Nombre del Laboratorio / Cliente:</label>
                    <input type="text" id="tienda" class="form-control" required placeholder="Ej. Laboratorio Vida">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mes de Activación:</label>
                    <select id="mes" class="form-select">
                        <option value="Octubre">Octubre</option>
                        <option value="Noviembre">Noviembre</option>
                        <option value="Diciembre">Diciembre</option>
                        <option value="Enero">Enero</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Año:</label>
                    <input type="text" id="anio" class="form-control" value="2026" readonly>
                </div>
                <button type="submit" class="btn btn-primary w-100">Generar Licencia Clave 🔑</button>
            </form>

            <div id="resultadoContainer" class="mt-4" style="display: none;">
                <div class="alert alert-success text-center">
                    <p class="small mb-1">¡Clave generada y guardada en la base de datos!</p>
                    <strong id="claveGenerada" class="fs-5 text-dark" style="user-select: all;"></strong>
                </div>
            </div>

            <div class="mt-3 text-center">
                <a href="index.html" class="btn btn-outline-secondary btn-sm">← Ir al Sistema Principal</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('formGen').addEventListener('submit', (e) => {
            e.preventDefault();
            const tienda = document.getElementById('tienda').value;
            const mes = document.getElementById('mes').value;
            const anio = document.getElementById('anio').value;

            fetch('/api/generar-licencia', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tienda, mes, anio })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('claveGenerada').innerText = data.key;
                    document.getElementById('resultadoContainer').style.display = 'block';
                } else {
                    alert('Error al generar la clave');
                }
            })
            .catch(err => console.error('Error:', err));
        });
    </script>
</body>
</html>
