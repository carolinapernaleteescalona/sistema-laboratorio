<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Pagos - Laboratorio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h3 class="text-primary mb-3">Caja y Registro de Pagos</h3>
            <form id="formPago">
                <div class="mb-3">
                    <label class="form-label">Nombre del Paciente</label>
                    <input type="text" id="paciente" class="form-control" required placeholder="Ej. Juan Pérez">
                </div>
                <div class="mb-3">
                    <label class="form-label">Monto ($)</label>
                    <input type="number" step="0.01" id="monto" class="form-control" required placeholder="0.00">
                </div>
                <div class="mb-3">
                    <label class="form-label">Forma de Pago</label>
                    <select id="metodo" class="form-select">
                        <option value="Efectivo USD">Efectivo (Divisas)</option>
                        <option value="Pago Movil">Pago Móvil / Bolívares</option>
                        <option value="Zelle">Zelle</option>
                        <option value="Tarjeta">Tarjeta de Débito</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100">Registrar y Cobrar</button>
            </form>
            <div class="mt-3 text-center">
                <a href="index.html" class="btn btn-link btn-sm">← Volver al Panel Principal</a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
